<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="100%" height="100%">
  <!-- Transparent background -->
  
  <!-- Stylized Dove Contour in Red (#e11d48 / #dc2626) -->
  <!-- Upper wing feather lines -->
  <path d="M 210 20 C 200 65 170 115 145 135" fill="none" stroke="#d91b38" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 265 8 C 285 70 270 125 250 160" fill="none" stroke="#d91b38" stroke-width="4.5" stroke-linecap="round" />

  <!-- Lower Dove Body and Tail Contour -->
  <path d="M 20 185
           C 40 180 50 155 60 152
           C 70 148 85 160 90 170
           C 95 190 115 250 165 265
           C 215 280 260 288 250 340
           C 240 342 225 345 205 345
           C 200 320 185 290 150 270
           C 110 250 65 240 45 200
           C 35 190 25 186 20 185 Z"
        fill="none" stroke="#d91b38" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Beak and Head -->
  <path d="M 20 185 C 45 175 42 160 62 153" fill="none" stroke="#d91b38" stroke-width="5" stroke-linecap="round" />

  <!-- The Bold Red Checkmark Wing with extended right point -->
  <polygon points="5,78 138,206 345,45 270,115 165,160 85,120" fill="#d91b38" />

  <!-- White text backdrop glow for "Bota Fé" -->
  <g transform="translate(130, 160) rotate(-22)">
    <!-- White contour stroke behind black script text for high contrast -->
    <text x="0" y="0" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" text-anchor="start">
      Bota Fé
    </text>
    <text x="0" y="0" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="44" font-weight="bold" fill="#111111" text-anchor="start">
      Bota Fé
    </text>

    <!-- Subtitle "mini TLC" -->
    <text x="15" y="24" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="22" font-style="italic" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" text-anchor="start">
      mini TLC
    </text>
    <text x="15" y="24" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="22" font-style="italic" font-weight="bold" fill="#111111" text-anchor="start">
      mini TLC
    </text>
  </g>
</svg>
